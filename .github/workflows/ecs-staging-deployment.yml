name: IVY ECS Deployment - Staging

on:
  push:
    branches:
      - staging

env:
  CLUSTER_NAME: "ivy-ecs-cluster-staging"
  ECS_SERVICE: "ivy-langfuse"
  TR_ARN: "ecs-task-role-ivy-langfuse-staging"
  ER_ARN: "ecs-task-execution-role-ivy-langfuse-staging"
  AWS_LG: "/ecs/staging/ivy-langfuse"
  T_FAMILY: "ivy-langfuse-staging"
  ECR_REPOSITORY_NAME: "ivy-backend-staging"

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STG }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag web image
        id: build-web
        run: |
          IMAGE_TAG="web-${{ github.sha }}"
          WEB_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG"

          docker build \
            -t $WEB_IMAGE_URI -f web/Dockerfile .

          echo "WEB_IMAGE_URI=$WEB_IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$WEB_IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and tag worker image
        id: build-worker
        run: |
          IMAGE_TAG="worker-${{ github.sha }}"
          WORKER_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:$IMAGE_TAG"

          docker build \
            -t $WORKER_IMAGE_URI -f worker/Dockerfile .

          echo "WORKER_IMAGE_URI=$WORKER_IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$WORKER_IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Push images to Amazon ECR
        run: |
          docker push ${{ env.WEB_IMAGE_URI }}
          docker push ${{ env.WORKER_IMAGE_URI }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STG }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve task definition placeholders
        run: |
          WEB_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:web-${{ github.sha }}"
          WORKER_IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:worker-${{ github.sha }}"

          sed \
            -e "s|<ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" \
            -e "s|<AWS_REGION>|${{ vars.AWS_REGION }}|g" \
            -e "s|<TR_ARN>|${{ env.TR_ARN }}|g" \
            -e "s|<ER_ARN>|${{ env.ER_ARN }}|g" \
            -e "s|<AWS_LG>|${{ env.AWS_LG }}|g" \
            -e "s|<T_FAMILY>|${{ env.T_FAMILY }}|g" \
            -e "s|<WEB_IMAGE>|$WEB_IMAGE|g" \
            -e "s|<WORKER_IMAGE>|$WORKER_IMAGE|g" \
            ecs_task_definition.json > resolved-task-definition.json

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: resolved-task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Show ECS service logs
        if: failure()
        run: aws logs tail "$AWS_LG" --since 15m --format short
