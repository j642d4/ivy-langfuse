name: IVY ECS Deployment - Production

on:
  workflow_dispatch:
    inputs:
      image_tag_suffix:
        description: >-
          Existing image tag suffix (the "<sha>" part of web-<sha>/worker-<sha>) to redeploy
          as-is, skipping the build/push step. Leave empty to build fresh from the branch/tag
          selected above.
        required: false
        type: string
        default: ""

env:
  CLUSTER_NAME: "ivy-ecs-cluster-production"
  ECS_SERVICE: "ivy-langfuse"
  TR_ARN: "ecs-task-role-ivy-langfuse-production"
  ER_ARN: "ecs-task-execution-role-ivy-langfuse-production"
  AWS_LG: "/ecs/production/ivy-langfuse"
  T_FAMILY: "ivy-langfuse-production"
  # Reusing the existing shared "backend" ECR repo rather than creating dedicated
  # langfuse-web/langfuse-worker repos — both images land here, disambiguated by
  # tag prefix (web-<tag> / worker-<tag>) instead of by repository.
  ECR_REPOSITORY_NAME: "ivy-backend-production"

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag_suffix == ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag web image
        id: build-web
        run: |
          IMAGE_TAG_SUFFIX="${{ github.ref_name }}"
          WEB_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:web-$IMAGE_TAG_SUFFIX"

          # --no-cache: see ecs-staging-deployment.yml for why this matters here.
          docker build --no-cache \
            -t $WEB_IMAGE_URI -f web/Dockerfile .

          echo "WEB_IMAGE_URI=$WEB_IMAGE_URI" >> $GITHUB_ENV
          echo "image_tag_suffix=$IMAGE_TAG_SUFFIX" >> $GITHUB_OUTPUT

      - name: Build and tag worker image
        id: build-worker
        run: |
          IMAGE_TAG_SUFFIX="${{ github.ref_name }}"
          WORKER_IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:worker-$IMAGE_TAG_SUFFIX"

          docker build --no-cache \
            -t $WORKER_IMAGE_URI -f worker/Dockerfile .

          echo "WORKER_IMAGE_URI=$WORKER_IMAGE_URI" >> $GITHUB_ENV
          echo "image_tag_suffix=$IMAGE_TAG_SUFFIX" >> $GITHUB_OUTPUT

      - name: Push images to Amazon ECR
        run: |
          docker push ${{ env.WEB_IMAGE_URI }}
          docker push ${{ env.WORKER_IMAGE_URI }}

    outputs:
      image_tag_suffix: ${{ steps.build-web.outputs.image_tag_suffix }}

  deploy:
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve image tag suffix to deploy
        id: img
        run: |
          if [ -n "${{ inputs.image_tag_suffix }}" ]; then
            echo "suffix=${{ inputs.image_tag_suffix }}" >> $GITHUB_OUTPUT
          else
            echo "suffix=${{ needs.build-and-push.outputs.image_tag_suffix }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify images exist in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids imageTag="web-${{ steps.img.outputs.suffix }}" \
            --region ${{ vars.AWS_REGION }} > /dev/null

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids imageTag="worker-${{ steps.img.outputs.suffix }}" \
            --region ${{ vars.AWS_REGION }} > /dev/null

      - name: Resolve task definition placeholders
        run: |
          WEB_IMAGE="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:web-${{ steps.img.outputs.suffix }}"
          WORKER_IMAGE="${{ secrets.AWS_ACCOUNT_ID_PROD }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_NAME }}:worker-${{ steps.img.outputs.suffix }}"

          sed \
            -e "s|<ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID_PROD }}|g" \
            -e "s|<AWS_REGION>|${{ vars.AWS_REGION }}|g" \
            -e "s|<TR_ARN>|${{ env.TR_ARN }}|g" \
            -e "s|<ER_ARN>|${{ env.ER_ARN }}|g" \
            -e "s|<AWS_LG>|${{ env.AWS_LG }}|g" \
            -e "s|<T_FAMILY>|${{ env.T_FAMILY }}|g" \
            -e "s|<WEB_IMAGE>|$WEB_IMAGE|g" \
            -e "s|<WORKER_IMAGE>|$WORKER_IMAGE|g" \
            ecs_task_definition.production.json > resolved-task-definition.json

      - name: Deploy updated task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: resolved-task-definition.json
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.CLUSTER_NAME }}
          wait-for-service-stability: true

      - name: Show ECS service logs
        if: failure()
        run: aws logs tail "$AWS_LG" --since 15m --format short
